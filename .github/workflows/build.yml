name: build

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "*.md"
      - "_docs/**"
  pull_request:

  workflow_dispatch:

jobs:
  # EasyTier JNI 原生库（内网映射，no-tun 不使用 VPN）：
  # 在固定 commit 的 EasyTier 仓库内用 cargo-ndk 分 ABI 交叉编译 libeasytier_android_jni.so。
  # 成品按内容寻址缓存：同一 EasyTier commit + ABI 直接复用，跳过整条 Rust 工具链与编译。
  easytier-jni:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ABI: arm64-v8a
            TARGET: aarch64-linux-android
          - ABI: armeabi-v7a
            TARGET: armv7-linux-androideabi
          - ABI: x86_64
            TARGET: x86_64-linux-android
    env:
      EASYTIER_REPO: https://github.com/EasyTier/EasyTier.git
      # 固定 EasyTier commit（main：新版 JNI 绑定，含 no-tun / port_forward / DHCP 支持）
      EASYTIER_REF: 57eb6908f4fc160f26946a14c672393a52df1101
    steps:
      - uses: actions/checkout@v4
        with:
          path: OpenListAndroid

      - name: Cache EasyTier JNI output
        id: jni-cache
        uses: actions/cache@v4
        with:
          path: jni-out/${{ matrix.ABI }}
          key: easytier-jni-${{ matrix.ABI }}-${{ env.EASYTIER_REF }}-v1

      # 缓存未命中才克隆 EasyTier（--depth 1 定向 commit，避免大仓库全量历史）
      - name: Checkout EasyTier (pinned)
        if: steps.jni-cache.outputs.cache-hit != 'true'
        run: |
          git init -q EasyTier
          git -C EasyTier remote add origin "$EASYTIER_REPO"
          git -C EasyTier fetch -q --depth 1 origin "$EASYTIER_REF"
          git -C EasyTier checkout -q FETCH_HEAD
          git -C EasyTier log -1 --oneline

      - name: Setup protoc
        if: steps.jni-cache.outputs.cache-hit != 'true'
        uses: arduino/setup-protoc@v3
        with:
          version: '35.1'
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust toolchain
        if: steps.jni-cache.outputs.cache-hit != 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.95
          target: ${{ matrix.TARGET }}
          cache: false
          rustflags: ''

      # Rust 增量编译缓存（target/ + registry）：EASYTIER_REF 变更时部分命中
      - name: Cache Rust build
        if: steps.jni-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: EasyTier
          cache-targets: 'true'

      - name: Setup Android NDK (r26)
        if: steps.jni-cache.outputs.cache-hit != 'true'
        id: setup-ndk-rust
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26

      - name: Cache cargo-ndk binary
        if: steps.jni-cache.outputs.cache-hit != 'true'
        id: cargo-ndk-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-bin-v1

      - name: Install cargo-ndk
        if: steps.jni-cache.outputs.cache-hit != 'true' && steps.cargo-ndk-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk --locked

      - name: Build EasyTier JNI
        if: steps.jni-cache.outputs.cache-hit != 'true'
        working-directory: EasyTier
        run: bash ../OpenListAndroid/.github/scripts/build-easytier-jni.sh "${{ matrix.ABI }}" "${{ matrix.TARGET }}" "$GITHUB_WORKSPACE/jni-out"
        env:
          # 与 runner 预装 NDK 冲突时 cargo-ndk 会告警，统一指向 r26 安装路径
          ANDROID_NDK_HOME: ${{ steps.setup-ndk-rust.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk-rust.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.setup-ndk-rust.outputs.ndk-path }}

      - name: Upload EasyTier JNI libs
        uses: actions/upload-artifact@v4
        with:
          name: easytier-jni-${{ matrix.ABI }}
          path: jni-out
          if-no-files-found: error

  # Beta 编译（对齐源项目 tmp/.github/workflows/build.yaml：OpenList beta 内核 + 签名 + 分 ABI APK）
  beta:
    if: github.event_name != 'pull_request'
    needs: [easytier-jni]
    runs-on: ubuntu-latest
    # 发布 dev Release 需要写权限（softprops/action-gh-release 用 GITHUB_TOKEN 创建 tag/release）
    permissions:
      contents: write
    env:
      output: "${{ github.workspace }}/app/build/outputs/apk/release"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 解析 OpenList beta 分支远程 HEAD SHA，作为 AAR / Go build cache 的内容寻址 key。
      # beta 是 moving ref，必须用实际 commit SHA 做 key，避免 tag 漂移后命中陈旧 AAR。
      - name: Resolve OpenList beta ref
        id: alist-ref
        run: |
          SHA=$(git ls-remote https://github.com/OpenListTeam/OpenList.git refs/heads/beta | cut -f1)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Resolved OpenList beta -> $SHA"

      # AAR 内容寻址缓存：OpenList 源码 rev + alistlib 绑定代码 + gobind 脚本未变时直接复用 AAR，
      # 跳过 setup-go / setup-ndk / init_gomobile / gobind / Wire AAR 整条链（含 Upload AAR）。
      - name: Cache Go AAR
        id: aar-cache
        uses: actions/cache@v4
        with:
          path: app/libs
          key: aar-beta-${{ steps.alist-ref.outputs.sha }}-${{ hashFiles('alist-lib/alistlib/**/*.go', 'alist-lib/scripts/gobind.sh') }}

      - name: Download OpenList Source Code (beta)
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          cd alist-lib/scripts
          chmod +x *.sh
          ./init_alist.sh beta
          ./init_web.sh

      - name: Mark OpenList Version as beta
        run: echo "beta" > $GITHUB_WORKSPACE/app/src/main/assets/openlist_version

      - uses: actions/setup-go@v5
        if: steps.aar-cache.outputs.cache-hit != 'true'
        with:
          go-version-file: "${{ github.workspace }}/alist-lib/go.mod"
          cache-dependency-path: "${{ github.workspace }}/alist-lib/go.sum"

      # Go build cache（~/.cache/go-build）：setup-go 只缓存模块下载，不缓存编译产物；
      # gobind 编译 OpenList 内核的中间产物复用，二次编译显著加速。restore-keys 允许跨 commit 部分命中。
      - name: Cache Go build
        if: steps.aar-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ steps.alist-ref.outputs.sha }}
          restore-keys: |
            go-build-${{ runner.os }}-

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: nttld/setup-ndk@v1
        if: steps.aar-cache.outputs.cache-hit != 'true'
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build OpenList Core (gomobile AAR)
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          cd $GITHUB_WORKSPACE/alist-lib/scripts
          ./init_gomobile.sh
          ./gobind.sh
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      # gobind.sh 按脚本内相对路径产出至 <root>/android/app/libs，接线到新工程 app/libs
      - name: Wire AAR into app/libs
        if: steps.aar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p app/libs
          mv -f android/app/libs/*.aar app/libs/
          ls -la app/libs

      - name: Upload AAR
        if: steps.aar-cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: "OpenList-beta"
          path: "${{ github.workspace }}/app/libs/*.aar"

      # EasyTier JNI 原生库注入 jniLibs（分 ABI；merge-multiple 合并三个 artifact 的 <abi>/ 目录）
      - name: Download EasyTier JNI libs
        uses: actions/download-artifact@v4
        with:
          pattern: easytier-jni-*
          path: app/src/main/jniLibs
          merge-multiple: true

      - name: Verify EasyTier JNI libs
        run: |
          ls -laR app/src/main/jniLibs
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "app/src/main/jniLibs/$abi/libeasytier_android_jni.so" \
              || { echo "ERROR: missing libeasytier_android_jni.so for $abi"; exit 1; }
          done

      # qBittorrent Enhanced nox（musl 静态二进制，BT 下载扩展功能）：
      # 上游 release 的 zip 解压出 qbittorrent-nox，改名 libqbittorrent-nox.so 注入
      # jniLibs（AGP 仅打包 lib 前缀；useLegacyPackaging 解压到 nativeLibraryDir 后可 exec）。
      # 版本须与 app QBittorrentSpec.EMBEDDED_VERSION 一致（当前 5.2.3.10）。
      - name: qBittorrent nox cache
        id: qbt-cache
        uses: actions/cache@v4
        with:
          path: qbt-nox-libs
          key: qbt-nox-v5.2.3.10-all-abi

      - name: Download qBittorrent Enhanced nox
        if: steps.qbt-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          BASE="https://github.com/c0re100/qBittorrent-Enhanced-Edition/releases/download/release-5.2.3.10"
          declare -A MAP=(
            [arm64-v8a]=qbittorrent-enhanced-nox_aarch64-linux-musl_static
            [armeabi-v7a]=qbittorrent-enhanced-nox_armv7-linux-musleabihf_static
            [x86_64]=qbittorrent-enhanced-nox_x86_64-linux-musl_static
          )
          for abi in arm64-v8a armeabi-v7a x86_64; do
            name="${MAP[$abi]}"
            echo "== $name -> $abi"
            curl -fSL --retry 5 --retry-delay 3 -o /tmp/qbt.zip "$BASE/$name.zip"
            rm -rf /tmp/qbt-out && mkdir -p /tmp/qbt-out
            unzip -o -q /tmp/qbt.zip -d /tmp/qbt-out
            bin=$(find /tmp/qbt-out -type f -name 'qbittorrent*' | head -1)
            test -n "$bin" || { echo "ERROR: no binary in $name.zip"; exit 1; }
            file "$bin"
            mkdir -p "qbt-nox-libs/$abi"
            install -m 755 "$bin" "qbt-nox-libs/$abi/libqbittorrent-nox.so"
          done

      - name: Inject qBittorrent nox into jniLibs
        run: |
          set -eu
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p "app/src/main/jniLibs/$abi"
            install -m 755 "qbt-nox-libs/$abi/libqbittorrent-nox.so" "app/src/main/jniLibs/$abi/libqbittorrent-nox.so"
            test -s "app/src/main/jniLibs/$abi/libqbittorrent-nox.so" \
              || { echo "ERROR: missing libqbittorrent-nox.so for $abi"; exit 1; }
            ls -la "app/src/main/jniLibs/$abi/libqbittorrent-nox.so"
          done

      # 与源项目同名 Secrets 键；gradle 侧由 app/build.gradle.kts 读取 local.properties
      - name: Init Signature
        run: |
          touch local.properties
          echo ALIAS_NAME='${{ secrets.ALIAS_NAME }}' >> local.properties
          echo ALIAS_PASSWORD='${{ secrets.ALIAS_PASSWORD }}' >> local.properties
          echo KEY_PASSWORD='${{ secrets.KEY_PASSWORD }}' >> local.properties
          echo KEY_PATH='${{ github.workspace }}/app/key.jks' >> local.properties
          # 从Secrets读取无换行符Base64解码, 然后保存到app/key.jks
          echo ${{ secrets.KEY_STORE }} | base64 --decode > $GITHUB_WORKSPACE/app/key.jks

      - name: Build Signed APK (split per ABI)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      # APK 命名：app-<abi>-release.apk -> OpenList-<abi>-release.apk
      - name: Rename APKs (app -> OpenList)
        run: |
          cd "${{ env.output }}"
          for f in app-*.apk; do
            [ -e "$f" ] || continue
            mv -v "$f" "OpenList-${f#app-}"
          done
          ls -lh

      # 体积透视：每个 APK 应只含一个 lib/<abi>/ 目录；若出现多个说明 splits 泄漏
      - name: Inspect APK native libs
        run: |
          ls -lh ${{ env.output }}/*.apk
          for apk in ${{ env.output }}/*.apk; do
            echo "=== $(basename $apk) ==="
            unzip -l "$apk" | grep "lib/" || echo "(no native libs)"
          done

      - name: Upload missing_rules.txt
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: "missing_rules-beta"
          path: "${{ github.workspace }}/app/build/outputs/mapping/release/missing_rules.txt"

      - name: Init APP Version Name
        run: |
          echo "ver_name=$(grep -m 1 'versionName' ${{ env.output }}/output-metadata.json | cut -d\" -f4)" >> $GITHUB_ENV

      - name: Upload App To Artifact arm64-v8a
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: "OpenList-beta-v${{ env.ver_name }}_arm64-v8a"
          path: "${{ env.output }}/*arm64-v8a*.apk"
          if-no-files-found: error

      - name: Upload App To Artifact arm-v7a
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: "OpenList-beta-v${{ env.ver_name }}_arm-v7a"
          path: "${{ env.output }}/*armeabi-v7a*.apk"
          if-no-files-found: error

      - name: Upload App To Artifact x86_64
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: "OpenList-beta-v${{ env.ver_name }}_x86_64"
          path: "${{ env.output }}/*x86_64*.apk"
          if-no-files-found: error

      # 滚动 dev 预发布：固定 tag `dev`，每次构建覆盖同名 Release 资产（三个分 ABI APK）
      - name: Publish dev build to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: dev
          body: |
            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Built at: ${{ github.event.head_commit.timestamp }}
          prerelease: true
          files: ${{ env.output }}/*.apk
